<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro | Yasmin Santos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Controle Financeiro</h1>
            <p>Gerencie suas receitas e despesas de forma simples.</p>
        </div>
    </header>

    <main class="container">

        <!-- Resumo financeiro -->
        <section class="resumo">

            <div class="card">
                <h2>Saldo</h2>
                <p id="saldo">R$ 0,00</p>
            </div>

            <div class="card">
                <h2>Receitas</h2>
                <p id="receitas">R$ 0,00</p>
            </div>

            <div class="card">
                <h2>Despesas</h2>
                <p id="despesas">R$ 0,00</p>
            </div>

        </section>

        <!-- Formulário -->
        <section class="formulario">

            <h2>Nova transação</h2>

            <form id="form-transacao">

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Salário"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        placeholder="0,00"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>

                    <select id="categoria" required>
                        <option value="">Selecione</option>
                        <option value="salario">Salário</option>
                        <option value="alimentacao">Alimentação</option>
                        <option value="transporte">Transporte</option>
                        <option value="lazer">Lazer</option>
                        <option value="estudos">Estudos</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo</label>

                    <select id="tipo" required>
                        <option value="">Selecione</option>
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input
                        type="date"
                        id="data"
                        required
                    >
                </div>

                <button type="submit">
                    Adicionar transação
                </button>

            </form>

        </section>

        <!-- Histórico -->
        <section class="historico">

            <div class="historico-topo">
                <h2>Histórico de transações</h2>

                <select id="filtro">
                    <option value="todos">Todas</option>
                    <option value="receita">Receitas</option>
                    <option value="despesa">Despesas</option>
                </select>
            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-transacoes">

                        <!-- O JavaScript vai inserir as transações aqui -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
